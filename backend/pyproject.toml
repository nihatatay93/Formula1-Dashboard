[project]
name = "formula1-dashboard-backend"
version = "0.1.0"
description = "Backend API and ingestion worker for Formula1 Dashboard"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.116,<1.0",
    "fastf1==3.8.3",
    "pandas>=2.2,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
    # signalrcore needs this at connect time but does not declare it.
    "websocket-client>=1.8,<2.0",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
package = false
