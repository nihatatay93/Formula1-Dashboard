name: formula1-dashboard

services:
  db:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: formula1_dashboard
      POSTGRES_USER: formula1_dashboard
      # A password, not trust. This local default is a development credential
      # and not a secret: the port is bound to loopback and the archive is
      # re-ingestible. A deployed instance must supply POSTGRES_PASSWORD from
      # its own secret store and never rely on this value.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formula1_dashboard_dev}
      # Refuse to initialise a cluster that would accept unauthenticated
      # connections, and hash with scram rather than md5.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U formula1_dashboard -d formula1_dashboard",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ./backend
    command: ["/opt/venv/bin/alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://formula1_dashboard:${POSTGRES_PASSWORD:-formula1_dashboard_dev}@db:5432/formula1_dashboard
    volumes:
      - ./backend:/workspace
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
    # Reload watches `app` only. The default is the whole working directory,
    # which includes `tests`, so appending a test case restarted the process --
    # and a restart destroys any live-timing session in progress, because the
    # collector lives in the application. That cost part of a real race
    # capture, so the watch is narrowed to the code the API actually serves.
    command:
      [
        "/opt/venv/bin/uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "app",
      ]
    environment:
      DATABASE_URL: postgresql://formula1_dashboard:${POSTGRES_PASSWORD:-formula1_dashboard_dev}@db:5432/formula1_dashboard
      FASTF1_CACHE_PATH: /cache/fastf1
      LIVE_TIMING_LOG_DIRECTORY: /live-sessions
      LIVE_TIMING_TOKEN_PATH: /live-auth/f1-token.json
      # The FastF1 companion extension posts to http://localhost:8000/auth on
      # your own machine, so the route it needs only works when the API runs
      # there. Enabled here, off by default, and deliberately left off on a
      # deployed instance where it could never complete the round trip.
      LIVE_TIMING_COMPANION_ENABLED: ${LIVE_TIMING_COMPANION_ENABLED:-true}
      # Access control is required by default. This local stack is bound to
      # loopback, so it opts out explicitly rather than carrying a password.
      # A deployed instance must leave this unset and set DASHBOARD_PASSWORD_HASH
      # and DASHBOARD_SECRET_KEY instead.
      DASHBOARD_AUTH_REQUIRED: ${DASHBOARD_AUTH_REQUIRED:-false}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:-}
      DASHBOARD_SECRET_KEY: ${DASHBOARD_SECRET_KEY:-}
      DASHBOARD_SECURE_COOKIES: ${DASHBOARD_SECURE_COOKIES:-false}
      # Optional: drive live timing from a recorded session instead of a live
      # upstream connection. Put a recording in ./recordings and set this to
      # /recordings/<file>.jsonl. Unset means no feed provider is configured.
      LIVE_TIMING_REPLAY_PATH: ${LIVE_TIMING_REPLAY_PATH:-}
      LIVE_TIMING_REPLAY_SPEED: ${LIVE_TIMING_REPLAY_SPEED:-10}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/workspace
      - ./recordings:/recordings:ro
      - fastf1_cache:/cache/fastf1
      - live_sessions:/live-sessions
      - live_auth:/live-auth
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "/opt/venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: ./backend
    command: ["/opt/venv/bin/python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://formula1_dashboard:${POSTGRES_PASSWORD:-formula1_dashboard_dev}@db:5432/formula1_dashboard
      FASTF1_CACHE_PATH: /cache/fastf1
      FASTF1_ARCHIVE_SESSION_MIN_INTERVAL_SECONDS: "1"
      FASTF1_RATE_LIMIT_COOLDOWN_SECONDS: "3600"
      FASTF1_REQUEST_OPERATIONAL_CEILING: "450"
      FASTF1_REQUEST_WARNING_THRESHOLD: "400"
      BACKFILL_WORKER_POLL_INTERVAL_SECONDS: "2"
      AUTOMATIC_CURRENT_SEASON_PLANNING_ENABLED: "true"
      AUTOMATIC_CURRENT_SEASON_PLANNING_INTERVAL_SECONDS: "900"
      WORKER_READY_FILE: /tmp/formula1-dashboard-worker.ready
    volumes:
      - ./backend:/workspace
      - fastf1_cache:/cache/fastf1
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 2m
    healthcheck:
      test:
        [
          "CMD",
          "/opt/venv/bin/python",
          "-c",
          "from pathlib import Path; raise SystemExit(0 if Path('/tmp/formula1-dashboard-worker.ready').is_file() else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    command:
      [
        "sh",
        "-c",
        "npm ci --prefer-offline --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0",
      ]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/workspace
      - frontend_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all(['/','/src/main.tsx','/src/index.css'].map((path) => fetch('http://127.0.0.1:5173' + path).then((response) => { if (!response.ok) throw new Error(path + ': ' + response.status) }))).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  fastf1_cache:
  frontend_node_modules:
  live_sessions:
  live_auth:
