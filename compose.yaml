name: formula1-dashboard

services:
  db:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: formula1_dashboard
      POSTGRES_USER: formula1_dashboard
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U formula1_dashboard -d formula1_dashboard",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ./backend
    command: ["/opt/venv/bin/alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://formula1_dashboard@db:5432/formula1_dashboard
    volumes:
      - ./backend:/workspace
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
    command:
      [
        "/opt/venv/bin/uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    environment:
      DATABASE_URL: postgresql://formula1_dashboard@db:5432/formula1_dashboard
      FASTF1_CACHE_PATH: /cache/fastf1
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/workspace
      - fastf1_cache:/cache/fastf1
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "/opt/venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: ./backend
    command: ["/opt/venv/bin/python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://formula1_dashboard@db:5432/formula1_dashboard
      FASTF1_CACHE_PATH: /cache/fastf1
      FASTF1_ARCHIVE_SESSION_MIN_INTERVAL_SECONDS: "90"
      FASTF1_RATE_LIMIT_COOLDOWN_SECONDS: "3600"
      BACKFILL_WORKER_POLL_INTERVAL_SECONDS: "2"
      WORKER_READY_FILE: /tmp/formula1-dashboard-worker.ready
    volumes:
      - ./backend:/workspace
      - fastf1_cache:/cache/fastf1
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 2m
    healthcheck:
      test:
        [
          "CMD",
          "/opt/venv/bin/python",
          "-c",
          "from pathlib import Path; raise SystemExit(0 if Path('/tmp/formula1-dashboard-worker.ready').is_file() else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/workspace
      - frontend_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  fastf1_cache:
  frontend_node_modules:
