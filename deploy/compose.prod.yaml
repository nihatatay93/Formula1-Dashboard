# Deployed stack. Run from the repository root:
#
#   docker compose -f deploy/compose.prod.yaml --env-file deploy/.env up -d --build
#
# Every secret is required rather than defaulted. The ${VAR:?...} form makes
# compose refuse to start when one is missing, which is the point: a deployment
# that silently fell back to a development credential would look healthy while
# being wide open. See deploy/.env.example.
#
# Nothing publishes a port. The only way in is the Cloudflare tunnel, which
# dials out, so the host firewall can deny all inbound traffic except SSH.

name: formula1-dashboard

services:
  db:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: formula1_dashboard
      POSTGRES_USER: formula1_dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U formula1_dashboard -d formula1_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  migrate:
    build:
      context: ../backend
    command: ["/opt/venv/bin/alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://formula1_dashboard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/formula1_dashboard
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../backend
    # No --reload: the reloader watches a filesystem that no longer changes,
    # and the running code is now the image rather than a mounted worktree.
    command:
      [
        "/opt/venv/bin/uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        # Caddy and the tunnel sit in front, so the client scheme and address
        # arrive in forwarded headers rather than on the socket.
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*",
      ]
    environment:
      DATABASE_URL: postgresql://formula1_dashboard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/formula1_dashboard
      FASTF1_CACHE_PATH: /cache/fastf1
      LIVE_TIMING_LOG_DIRECTORY: /live-sessions
      LIVE_TIMING_TOKEN_PATH: /live-auth/f1-token.json
      # The companion extension posts to localhost on the reader's machine,
      # which is not this host, so the route it needs stays off.
      LIVE_TIMING_COMPANION_ENABLED: "false"
      DASHBOARD_AUTH_REQUIRED: "true"
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:?DASHBOARD_PASSWORD_HASH is required, generate with backend/scripts/hash_password.py}
      DASHBOARD_SECRET_KEY: ${DASHBOARD_SECRET_KEY:?DASHBOARD_SECRET_KEY is required, use at least 48 random characters}
      # Cloudflare terminates TLS, so the cookie is only ever sent over HTTPS.
      DASHBOARD_SECURE_COOKIES: "true"
    volumes:
      - fastf1_cache:/cache/fastf1
      - live_sessions:/live-sessions
      - live_auth:/live-auth
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "/opt/venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready').read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: ../backend
    command: ["/opt/venv/bin/python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://formula1_dashboard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/formula1_dashboard
      FASTF1_CACHE_PATH: /cache/fastf1
      FASTF1_ARCHIVE_SESSION_MIN_INTERVAL_SECONDS: "1"
      FASTF1_RATE_LIMIT_COOLDOWN_SECONDS: "3600"
      FASTF1_REQUEST_OPERATIONAL_CEILING: "450"
      FASTF1_REQUEST_WARNING_THRESHOLD: "400"
      BACKFILL_WORKER_POLL_INTERVAL_SECONDS: "2"
      AUTOMATIC_CURRENT_SEASON_PLANNING_ENABLED: "true"
      AUTOMATIC_CURRENT_SEASON_PLANNING_INTERVAL_SECONDS: "900"
      WORKER_READY_FILE: /tmp/formula1-dashboard-worker.ready
    volumes:
      - fastf1_cache:/cache/fastf1
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Loading a session with telemetry is the heaviest thing here; it was
    # measured peaking near 300 MiB, so this leaves real headroom without
    # letting a runaway take the host down.
    stop_grace_period: 2m
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  tunnel:
    image: cloudflare/cloudflared:2026.7.1
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required, from the Cloudflare Zero Trust dashboard}
    depends_on:
      - web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  fastf1_cache:
  live_sessions:
  live_auth:
